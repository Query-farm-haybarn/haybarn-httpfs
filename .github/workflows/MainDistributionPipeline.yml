#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline
# (Query-farm-haybarn/haybarn-extension-ci-tools, haybarn-2.0 branch) so the build
# runs in haybarn-ci images with Haybarn's R2-backed ccache, links the Haybarn
# engine (override_duckdb_repository), and deploys to Haybarn R2 with the Haybarn
# signing key and CalVer. duckdb_version is the Haybarn engine release tag; ci_phase
# maps it to the embedded v2.0.0 version. The engine's haybarn-extensions.yml is the
# canonical builder, so push is disabled here; a dispatch on haybarn-2.0 deploys.
#
name: Main Extension Distribution Pipeline
on:
  # push:  # Haybarn: disabled — built via core engine haybarn-extensions.yml SHA pin
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@5fde928546a7c1c4c3fe9f7756b185ae87f27a7f
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      extension_name: &ext_name httpfs
      duckdb_version: &duckdb_ref haybarn-v2.0.0-rc1
      ci_tools_version: &ci_tools_ref 5fde928546a7c1c4c3fe9f7756b185ae87f27a7f
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: &ci_tools_repo 'Query-farm-haybarn/haybarn-extension-ci-tools'

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@5fde928546a7c1c4c3fe9f7756b185ae87f27a7f
    secrets: inherit
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      override_ci_tools_repository: *ci_tools_repo
      deploy_latest: ${{ github.ref == 'refs/heads/haybarn-2.0' }}
      deploy_versioned: ${{ github.ref == 'refs/heads/haybarn-2.0' }}

  code-quality:
    name: Code Quality
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_code_quality.yml@5fde928546a7c1c4c3fe9f7756b185ae87f27a7f
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      override_ci_tools_repository: *ci_tools_repo
      extra_toolchains: 'python3'
      format_checks: 'format'

  tidy:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
      TIDY_CHECKS: readability-convert-member-functions-to-static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Install
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-tidy libcurl4-openssl-dev libssl-dev
          sudo pip3 install 'pybind11[global]' --break-system-packages
      - name: Tidy Check
        run: make tidy-check

  relassert:
    name: Build relassert
    runs-on: ${{ 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 5GB
          evict-old-files: job
      - name: Build (relassert → ASan + UBSan + LSan)
        uses: Query-farm-haybarn/haybarn-ci/build-duckdb@e0ad82dd40f1218f92e99adade6810c4c97b3279 # haybarn
        with:
          build-type: relassert
          build: python3 duckdb/scripts/ci/retry.py -- make relassert
          test: make unittest_relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
