#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline (not upstream
# duckdb/extension-ci-tools) so the build picks up Haybarn's R2-backed ccache,
# pre-built GHCR images, and 4.13.6 toolchain. override_duckdb_repository
# points the clone at the Haybarn engine.
#
name: Main Extension Distribution Pipeline
on:
  push:
    # Only the haybarn integration branch publishes. PRs build via the
    # pull_request trigger below but skip deploy (the deploy_versioned
    # condition matches on github.ref == 'refs/heads/haybarn' only).
    branches:
      - haybarn
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@f0dc2977a2be5688dfa4048b9fc45e6a3730e812
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      extension_name: httpfs
      duckdb_version: haybarn-v1.5.3-rc3
      ci_tools_version: haybarn
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      # Use the pre-built Haybarn Docker images from GHCR instead of doing
      # a ~5-8 min inline `docker build` on every leg. The images already
      # have vcpkg, the toolchain, and ccache 4.13.6 baked in.
      #   ghcr.io/query-farm-haybarn/haybarn-<arch>-base:v1.5.2          (linux)
      #   ghcr.io/query-farm-haybarn/haybarn-wasm-base:v1.5.2            (wasm)
      use_prebuilt_images: true
      use_prebuilt_wasm_image: true

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@f0dc2977a2be5688dfa4048b9fc45e6a3730e812
    secrets: inherit
    with:
      extension_name: httpfs
      duckdb_version: haybarn-v1.5.3-rc3
      ci_tools_version: haybarn
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      # Push-to-haybarn writes BOTH the versioned CalVer path AND the rolling-
      # latest pointer. Versioned for reproducibility/pinning; latest so
      # `INSTALL httpfs FROM haybarn` resolves the just-published binary
      # without needing a separate alias-update step.
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
      # CalVer + haybarn-tag normalization + Cache-Control fix-up are handled
      # by the reusable workflow's calver-deploy composite action — no per-
      # extension wrapper needed.

  code-quality:
    name: Code Quality
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_code_quality.yml@f0dc2977a2be5688dfa4048b9fc45e6a3730e812
    with:
      extension_name: httpfs
      duckdb_version: haybarn-v1.5.3-rc3
      ci_tools_version: haybarn
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      extra_toolchains: 'python3'
      format_checks: 'format'
