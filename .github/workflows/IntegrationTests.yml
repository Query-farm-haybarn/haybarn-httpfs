# Haybarn: push trigger removed — this standalone test workflow doesn't gate any
# production artifact; the core engine's haybarn-extensions.yml is the canonical builder.
name: Integration Tests
on:
  pull_request:
  repository_dispatch:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

env:
  X_VCPKG_ASSET_SOURCES: 'clear;x-azurl,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/assets/,,read'

jobs:
  linux-tests-httpfs:
    name: MinIO Tests
    runs-on: ubuntu-latest
    env:
      S3_TEST_SERVER_AVAILABLE: 1
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: minio_duckdb_user
      AWS_SECRET_ACCESS_KEY: minio_duckdb_user_password
      DUCKDB_S3_ENDPOINT: duckdb-minio.com:9000
      DUCKDB_S3_USE_SSL: false
      HTTP_PROXY_PUBLIC: localhost:3128
      TEST_PERSISTENT_SECRETS_AVAILABLE: true
      CORE_EXTENSIONS: "parquet;json;tpch"
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux
      PYTHON_HTTP_SERVER_URL: http://localhost:8008
      PYTHON_HTTP_SERVER_DIR: /tmp/python_test_server
      # Haybarn: ccache tuning — mirror extension-ci-tools so this standalone
      # job shares the same warm cache instead of GitHub's per-branch local
      # cache, which never warms here: this workflow has no push trigger, so the
      # haybarn base branch never builds a cache for PRs to inherit, and a PR's
      # own cache is invisible to every other PR (refs/pull/<n>/merge scope).
      # Strip the absolute workspace prefix from hashes, tolerate __DATE__/
      # header-mtime variance, and hash the compiler binary content. R2
      # (Cloudflare Worker, same bucket/auth as vcpkg) is the shared L2 backend.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ninja
        shell: bash
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          # GitHub Actions local cache disabled (parity with extension-ci-tools):
          # it never warms for PRs here (no push trigger on haybarn -> no
          # base-branch cache to inherit) and is branch-scoped. The shared R2
          # backend (CCACHE_REMOTE_STORAGE, set in env above) is the real cache.
          # The action is still used to install ccache and set CCACHE_DIR.
          key: ccache-minio-httpfs
          save: 'false'
          read-only: 'true'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Fix permissions of test secrets
        shell: bash
        run: chmod -R 700 data/secrets

      # TODO: fix the authenticated proxy here
      - name: Install and run http proxy squid
        shell: bash
        run: |
          sudo apt-get install squid
          ./scripts/run_squid.sh --port 3128 --log_dir squid_logs &

      - name: Run & Populate Python test server
        shell: bash
        run: |
          mkdir -p $PYTHON_HTTP_SERVER_DIR
          cd $PYTHON_HTTP_SERVER_DIR
          python3 -m http.server 8008 &

      - name: Build
        shell: bash
        run: make

      - name: Install test server
        shell: bash
        run: |
          sudo ./scripts/install_s3_test_server.sh
          ./scripts/generate_presigned_url.sh

      - name: Start test server & run tests
        shell: bash
        run: |
          source ./scripts/run_s3_test_server.sh
          source ./scripts/set_s3_test_server_variables.sh
          ./build/release/test/unittest "*" --skip-error-messages "[]"
          ./build/release/test/unittest "*" --skip-error-messages "[]" --statically-loaded-extensions "[httpfs,parquet,core_functions]" --on-init "SET httpfs_client_implementation='curl';" || true
          ./build/release/test/unittest "*" --skip-error-messages "[]" --statically-loaded-extensions "[httpfs,parquet,core_functions]" --on-init "SET httpfs_client_implementation='httplib';" || true
          ./build/release/test/unittest "*" --skip-error-messages "[]" --statically-loaded-extensions "[httpfs,parquet,core_functions]" --on-init "SET httpfs_connection_caching=true;" || true
